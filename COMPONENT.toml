[component]
name = "SigmaOS-init"
tier = 1
stability = "beta"
language = "rust"
description = "An evolving Rust library for system initialization and service/session models. It exposes SigmaInit through the InitSystem alias and includes service state and restart-policy types, systemd-style unit parsing and service structures, login session models, and timesyncd configuration."
upstream = ["https://github.com/chimera-linux/dinit"]

[contract]
provides = ["pid1-init", "rc-script-runner", "orphan-reaper"]
depends_on = ["SigmaOS-system"]

[maturity]
status = "Implemented"
test_evidence = "Compiles and passes AAA unit tests"
next_milestone = "Hardware and runtime integration"
